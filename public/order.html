<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn hàng | Cửa hàng Đặng Thới</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">Cửa hàng Đặng Thới</a>
      <form action="/" method="get" class="search-form">
        <input id="search" name="q" type="search" placeholder="Tìm sản phẩm..." maxlength="100" aria-label="Tìm sản phẩm">
      </form>
      <a class="cart-link" href="/gio-hang" aria-label="Giỏ hàng">Giỏ hàng <span id="cart-count" class="cart-count" hidden>0</span></a>
    </div>
  </header>

  <main class="wrap">
    <p id="order-loading" class="note">Đang tải...</p>

    <section id="order-view" hidden></section>

    <section id="order-missing" class="notfound" hidden>
      <h1>Không tìm thấy đơn hàng</h1>
      <p>Mã đơn có thể bị sai. Hãy kiểm tra lại mã bạn đã nhận.</p>
      <a class="btn" href="/">Về trang chủ</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© Cửa hàng nhà đẹp</div>
  </footer>

  <script src="/common.js"></script>
  <script src="/order.js"></script>
</body>
</html>
